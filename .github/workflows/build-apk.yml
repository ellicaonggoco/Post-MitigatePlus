name: Build Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build Standalone Release APK with Offline Bundle
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache
          mkdir -p ../dist
          cp $(find app/build/outputs/apk -name "*.apk" | head -n 1) ../dist/app-release.apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../dist/ \;
          ls -la ../dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitigatePlus-Android-Release-APK
          path: mobile-app/dist/app-release.apk

      - name: Publish app-release.apk to GitHub Release using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.4.2-apk --yes || true
          gh release create v2.4.2-apk mobile-app/dist/app-release.apk --title "MitigatePlus v2.4.2 Standalone Release APK" --notes "Official standalone release APK with embedded offline bundle, mandatory ID photo validation, and OTP phone verification."

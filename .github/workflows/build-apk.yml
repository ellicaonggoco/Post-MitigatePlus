name: Build Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build Standalone Release APK with Offline Bundle
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitigatePlus-Android-Release-APK
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.2-apk
          name: "MitigatePlus v2.4.2 Standalone Android APK (Live Build)"
          body: "Official standalone Android Release APK containing embedded offline bundle, Mandatory ID Photo Validation, 6-Digit SMS/Email OTP Phone Verification Modal, and Real-Time WebSocket Approval Sync."
          draft: false
          prerelease: false
          files: |
            mobile-app/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
